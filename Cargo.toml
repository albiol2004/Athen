[workspace]
resolver = "2"
members = [
    "crates/athen-core",
    "crates/athen-ipc",
    "crates/athen-sentidos",
    "crates/athen-coordinador",
    "crates/athen-agent",
    "crates/athen-llm",
    "crates/athen-web",
    "crates/athen-memory",
    "crates/athen-risk",
    "crates/athen-persistence",
    "crates/athen-contacts",
    "crates/athen-sandbox",
    "crates/athen-shell",
    "crates/athen-app",
    "crates/athen-mcp",
    "crates/athen-scheduler",
    "crates/athen-vault",
    "crates/athen-caldav",
    "crates/athen-checkpoint",
    "crates/athen-voice",
    "crates/athen-cli",
    "crates/athen-admin",
]

[workspace.dependencies]
# Internal
athen-core = { path = "crates/athen-core" }
# athen-ipc stays a workspace member (own tests + future multi-process split)
# but no crate currently links it, so it has no [workspace.dependencies] alias.
athen-persistence = { path = "crates/athen-persistence" }
athen-risk = { path = "crates/athen-risk" }
athen-contacts = { path = "crates/athen-contacts" }
athen-sandbox = { path = "crates/athen-sandbox" }
athen-shell = { path = "crates/athen-shell" }
athen-llm = { path = "crates/athen-llm" }
athen-memory = { path = "crates/athen-memory" }
athen-sentidos = { path = "crates/athen-sentidos" }
athen-coordinador = { path = "crates/athen-coordinador" }
athen-agent = { path = "crates/athen-agent" }
athen-mcp = { path = "crates/athen-mcp" }
athen-web = { path = "crates/athen-web" }
athen-scheduler = { path = "crates/athen-scheduler" }
athen-vault = { path = "crates/athen-vault" }
athen-caldav = { path = "crates/athen-caldav" }
athen-checkpoint = { path = "crates/athen-checkpoint" }
athen-voice = { path = "crates/athen-voice" }

# External
# tokio "full" trimmed to the features the workspace actually references (grep
# evidence in loop/REPORT.md). Dropped vs "full": io-std (zero tokio::io::std*
# call sites) and parking_lot (internal lock impl only; behavior-identical).
# Per-crate dev-dependencies keep ["full", "test-util"] and are unaffected.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "signal", "io-util"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
url = { version = "2", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
# Trimmed defaults: workspace uses only Stream/StreamExt/FutureExt/join_all/
# select_ok (all in futures-util "std"); zero executor/async-await-macro/
# channel/io/sink call sites (grep evidence in loop/REPORT.md), so the
# futures-executor and futures-macro subcrates are dropped.
futures = { version = "0.3", default-features = false, features = ["std"] }
arc-swap = "1"
toml = "0.8"
imap = { version = "2.4", default-features = false }
rustls-connector = { version = "0.22", default-features = true }
mailparse = "0.16"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "hostname", "pool"] }
rmcp = { version = "1.5", default-features = false }
schemars = "1.0"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
quick-xml = "0.36"

[profile.release]
strip = true          # drop symbols/debuginfo from the shipped binary
lto = "thin"          # thin LTO: nearly all of fat's cross-crate benefit at a fraction of the build time.
                      # DO NOT set "fat": it blew the Copr release build past its 5h timeout on this
                      # workspace (v0.6.0, all chroots), where "thin" built v0.5.x in ~58min. Only
                      # revisit "fat" if you've verified Copr can finish it (raise --timeout first).
codegen-units = 1     # single CGU maximizes optimization/dedup across the crate
# opt-level left at default 3 — "s" is a size-vs-speed DECISION for the human (see loop/REPORT.md)
# panic = "abort" intentionally NOT set: workspace code relies on unwinding
# (catch_unwind panic containment in athen-scheduler ticks, athen-app approval
# routers/background loops, loop_mode LoopLock RAII release) — abort would
# turn contained panics into process death.
