<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161110" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23e8745a'/%3E%3Ctext x='12' y='16.5' font-family='system-ui' font-size='13' font-weight='700' fill='%2320120d' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />

    <!-- PWA: installable "Add to Home Screen" on iOS/iPadOS + Android/Chromium.
         Served by http_api.rs from web/dist when Remote Access or headless mode
         exposes the web UI. Icons + manifest live in web/public/ (copied to
         dist/ root by Vite). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple: no web app manifest support pre-iOS 16.4, so these drive
         standalone launch, status-bar style, and the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Athen" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android/Chromium standalone hint (theme-color meta above styles the bar) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Athen" />

    <title>Athen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
